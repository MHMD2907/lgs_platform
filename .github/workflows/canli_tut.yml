name: Veritabanini canli tut

on:
  schedule:
    - cron: "0 6 */3 * *"   # 3 gunde bir, Turkiye saatiyle 09:00
  workflow_dispatch:        # "Run workflow" dugmesiyle elle de calisir

permissions:
  actions: write
  contents: read

jobs:
  canli-tut:
    runs-on: ubuntu-latest
    steps:
      - name: Veritabanina kucuk bir okuma sorgusu gonder
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "DB_URL gizli bilgisi eklenmemis. Settings > Secrets and variables > Actions bolumunden ekleyin."
            exit 1
          fi
          pip install --quiet "psycopg[binary]"
          python - <<'EOF'
          import os, psycopg
          with psycopg.connect(os.environ["DB_URL"], connect_timeout=20,
                               prepare_threshold=None) as baglanti:
              adet = baglanti.execute("SELECT COUNT(*) FROM exams").fetchone()[0]
          print(f"Veritabani ayakta: {adet} deneme kayitli.")
          EOF

      # GitHub, 60 gun yeni yukleme olmazsa zamanlanmis isleri durduruyor;
      # bu adim o sayaci her seferinde sifirliyor.
      - name: Bu zamanlayicinin GitHub tarafindan durdurulmasini onle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/canli_tut.yml/enable"
